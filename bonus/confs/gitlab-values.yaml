# GitLab Helm chart - Configuration minimale pour le bonus IoT
# Desactive les composants non essentiels pour reduire les ressources

global:
  hosts:
    domain: gitlab.local
    https: false
  ingress:
    configureCertmanager: false
    class: traefik
    enabled: false
    tls:
      enabled: false
  kas:
    enabled: false
  pages:
    enabled: false
  # Stockage objet desactive : tous les usages qui le consommeraient
  # (lfs, artifacts, uploads, packages, terraformState) sont coupes ci-dessous,
  # et externalDiffs / dependencyProxy / ciSecureFiles sont deja a false par
  # defaut. Le checkConfig objectStorage ne se declenche donc pas.
  minio:
    enabled: false
  appConfig:
    lfs:
      enabled: false
    artifacts:
      enabled: false
    uploads:
      enabled: false
    packages:
      enabled: false
    terraformState:
      enabled: false

# Desactiver les sous-charts non necessaires
#
# La cle a change de nom : le chart 9.0.0 a remplace `certmanager.install` par
# `installCertmanager` a la racine. Depuis, `certmanager` est l'alias du vrai
# sous-chart jetstack, qui embarque un values.schema.json en
# additionalProperties:false : y injecter une cle `install` inconnue fait
# echouer helm a la validation.
installCertmanager: false

nginx-ingress:
  enabled: false

prometheus:
  install: false

gitlab-runner:
  install: false

registry:
  enabled: false

# Configuration minimale des composants GitLab
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    # Reservation ramenee de 2.5G a 1.5G : sur un cluster k3d contraint, une
    # demande trop haute laisse le pod en Pending. N'agit que sur l'ordonnancement.
    resources:
      requests:
        cpu: 100m
        memory: 1500M
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    # concurrency 20 -> 5 : c'est le vrai levier sur la memoire CONSOMMEE.
    # Chaque thread Sidekiq porte son propre jeu d'objets Ruby, et le bonus
    # n'a qu'un seul utilisateur.
    concurrency: 5
    # Un worker qui depasse 1 Go est redemarre, au lieu de 2 Go par defaut.
    memoryKiller:
      maxRss: 1000000
    resources:
      requests:
        cpu: 100m
        memory: 1G
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  gitaly:
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
  kas:
    enabled: false
  # Composants inutiles au bonus : le sujet demande d'heberger un depot Git et
  # de laisser Argo CD le lire. Sauvegardes, metriques Prometheus et reception
  # d'emails n'y participent pas.
  toolbox:
    enabled: false      # utilitaire de sauvegarde/restauration
  gitlab-exporter:
    enabled: false      # exporteur de metriques Prometheus
  mailroom:
    enabled: false      # traitement des emails entrants

# --- Images PostgreSQL et Redis : redirection vers bitnamilegacy ---
#
# Bitnami a retire de Docker Hub tous les tags versionnes de ses images : seul
# `latest` subsiste sous `bitnami/`, le reste a ete deplace sous
# `bitnamilegacy/`. Les tags references par le chart 9.11.12 renvoient donc 404
# et le deploiement part en ImagePullBackOff sur la base et le cache.
#
# Les tags ci-dessous sont ceux du chart 9.11.12 : ils doivent etre reajustes
# si CHART_VERSION change dans scripts/deploy_gitlab.sh.
#
# Reserve : `bitnamilegacy` est une archive presentee comme transitoire par
# Bitnami. Si elle disparait, il faudra passer a une base PostgreSQL et un
# Redis externes (images officielles `postgres` et `redis`) et renseigner
# `global.psql` et `global.redis` : c'est la voie supportee depuis le chart
# 10.0.0, qui ne groupe plus du tout PostgreSQL, Redis ni MinIO.

postgresql:
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.1.0-debian-11-r25
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 11-debian-11-r95
  metrics:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgres-exporter
      tag: 0.15.0-debian-11-r7

redis:
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.4-debian-12-r9
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r16
  sentinel:
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-sentinel
      tag: 7.2.4-debian-12-r7
  metrics:
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-exporter
      tag: 1.58.0-debian-12-r4
  kubectl:
    image:
      registry: docker.io
      repository: bitnamilegacy/kubectl
      tag: 1.29.2-debian-12-r3
  sysctl:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r16
